experiment_name: vit_small_224_max_flare_class
output_dir: outputs/vit_small_224_max_flare_class

# SuryaBench supplies only images, timestamps, and frozen membership. NOAA-derived
# `max_flare_class` in these files is the sole supervised target.
zarr_path: /scratch/users/jhong36/surya-bench-224-v2.zarr
source_split_dir: /scratch/users/jhong36/data
derived_target_dir: /scratch/users/jhong36/data/surya_index
target_column: max_flare_class

image_size: 224
in_chans: 13
channel_order:
  - aia94
  - aia131
  - aia171
  - aia193
  - aia211
  - aia304
  - aia335
  - aia1600
  - hmi_m
  - hmi_bx
  - hmi_by
  - hmi_bz
  - hmi_v
normalization: signed_log1p_train_channel_zscore
normalization_stats_path: outputs/input_normalization_stats/train_channel_stats.json

model_name: vit_small_patch16_224
patch_size: 16
pretrained: false
optimizer: adamw
learning_rate: 0.0001
weight_decay: 0.01
epochs: 10
batch_size: 4
gradient_accumulation_steps: 1
num_workers: 0
precision: fp16
seed: 20260915
checkpoint_metric: macro_f1
